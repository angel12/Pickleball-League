services:
  app:
    build: .
    container_name: pickleball-league
    environment:
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./league-data:/app/data
    restart: unless-stopped

  app-hostnet:
    build: .
    container_name: pickleball-league-hostnet
    profiles: ["hostnet"]
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
    volumes:
      - ./league-data:/app/data
    restart: unless-stopped
